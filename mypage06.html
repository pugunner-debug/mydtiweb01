<body>
    <!-- ทดสอบการสร้างตาราง -->
    <table border="1" width="600px">
        <!DOCTYPE html>
        <html lang="en">

        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Document</title>
        </head>

        <body>
            <!-- ทดสอบการสร้างตาราง -->
            <table border="1" width="600px">
                <!-- Row 1 -->
                <tr>
                    <td colspan="2" rowspan="2">a</td>
                    <td>b</td>
                    <td>c</td>
                    <td rowspan="2">d</td>
                </tr>
                <!-- Row 2 -->
                <tr>
                    <td colspan="2">e</td>
                </tr>
                <!-- Row 3 -->
                <tr>
                    <td rowspan="2">f</td>
                    <td colspan="3">g</td>
                    <td>h</td>
                </tr>
                <!-- Row 4 -->
                <tr>
                    <td>i</td>
                    <td>j</td>
                    <td colspan="2">k</td>
                </tr>
            </table>


    </table>
</body>

</html>
</table>
</body>
